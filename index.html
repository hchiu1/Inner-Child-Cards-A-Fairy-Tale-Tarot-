* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--night); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--serif);
  background-color: var(--night);
  background-image:
    radial-gradient(ellipse 80% 55% at 50% 42%, rgba(255, 244, 210, 0.9), transparent 72%),
    radial-gradient(ellipse 90% 60% at 50% 118%, rgba(200, 140, 50, 0.35), transparent 70%);
  background-attachment: fixed;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.rays {
  position: fixed;
  left: 50%;
  top: 52%;
  width: min(1100px, 140vw);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  opacity: 0.22;
  pointer-events: none;
  z-index: 0;
}

.table {
  position: relative;
  z-index: 1;
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 34px 20px 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

header { text-align: center; }
h1 {
  margin: 0;
  font-weight: 600;
  font-size: clamp(28px, 5vw, 42px);
  letter-spacing: 0.24em;
  padding-left: 0.24em;
}
#hint {
  margin: 12px 0 0;
  min-height: 1.7em;
  color: var(--muted);
  font-size: clamp(15px, 2.4vw, 17px);
  letter-spacing: 0.08em;
  transition: opacity 0.25s ease;
}
#hint.fade { opacity: 0; }

.board {
  display: grid;
  width: 100%;
  flex: 1;
  margin-top: 8px;
}
.scene {
  grid-area: 1 / 1;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s ease, visibility 0s linear 0.5s;
}
.scene.on {
  opacity: 1;
  visibility: visible;
  z-index: 2;
  transition: opacity 0.25s ease, visibility 0s;
}

/* ---------- Spread (78 card backs, three concentric rings) ---------- */
#spread { display: grid; align-content: center; justify-items: center; }
.orbit {
  --S: 600px;
  position: relative;
  width: var(--S);
  height: var(--S);
  margin: 6px auto 0;
}
.hub {
  position: absolute;
  left: 50%;
  top: 50%;
  width: calc(var(--S) * 0.09);
  height: calc(var(--S) * 0.09);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f6d883, #d9a032 65%, #b8801c);
  box-shadow: 0 0 0 2px rgba(62, 42, 30, 0.25), 0 0 calc(var(--S) * 0.05) rgba(217, 160, 50, 0.55);
  pointer-events: none;
  animation: hubIn 1.1s ease backwards;
}
.hub::before {
  content: "";
  position: absolute;
  inset: -60%;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(190, 130, 30, 0.8) 0 3deg, transparent 3deg 22.5deg);
  -webkit-mask: radial-gradient(closest-side, #000 45%, transparent 100%);
  mask: radial-gradient(closest-side, #000 45%, transparent 100%);
}
@keyframes hubIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.4); } }
.fc {
  appearance: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  position: absolute;
  left: calc(50% - var(--S) * 0.044);
  top: calc(50% - var(--S) * 0.0699);
  width: calc(var(--S) * 0.088);
  aspect-ratio: 63 / 100;
  background: var(--back) center / cover no-repeat;
  border-radius: 4% / 2.5%;
  box-shadow: 0 0 0 1px rgba(62, 42, 30, 0.4), 0 4px 10px rgba(62, 42, 30, 0.4);
  transform: rotate(var(--a)) translateY(calc(var(--S) * var(--rr) * -1));
  transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.28s ease;
  animation: deal 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  animation-delay: calc(var(--i) * 9ms + 250ms);
  -webkit-tap-highlight-color: transparent;
}
.fc.picked { visibility: hidden; }
@keyframes deal {
  from {
    transform: rotate(var(--a)) translateY(0) scale(0.4);
    opacity: 0;
  }
}
@media (hover: hover) {
  .fc:hover {
    transform: rotate(var(--a)) translateY(calc(var(--S) * var(--rr) * -1 - 14px)) scale(1.08);
    z-index: 200;
    box-shadow: 0 0 0 1px rgba(62, 42, 30, 0.9), 0 0 24px rgba(217, 160, 50, 0.7), 0 10px 20px rgba(62, 42, 30, 0.45);
  }
}
.fc:focus-visible {
  outline: 2px solid var(--sun);
  outline-offset: 3px;
  transform: rotate(var(--a)) translateY(calc(var(--S) * var(--rr) * -1 - 14px)) scale(1.08);
  z-index: 200;
}

/* ---------- Reveal ---------- */
#reveal {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  padding-top: 18px;
}
.group {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  width: 100%;
}
.stagecard {
  position: relative;
  flex: none;
  width: var(--cw);
  aspect-ratio: 63 / 100;
  perspective: 1400px;
}
.stagecard::before {
  content: "";
  position: absolute;
  inset: -14%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 246, 214, 0.85), transparent);
  opacity: 0;
  transition: opacity 1.4s ease;
  pointer-events: none;
}
.stagecard.glow::before { opacity: 1; }
.flipper {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 1.1s cubic-bezier(0.3, 0.7, 0.2, 1);
}
.flipper.flipped { transform: rotateY(180deg); }
.face {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 4% / 2.5%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 0 0 1px rgba(62, 42, 30, 0.25), 0 22px 44px rgba(100, 65, 10, 0.35);
  object-fit: cover;
}
.face.back { background: var(--back) center / cover no-repeat; }
.face.front { transform: rotateY(180deg); background: var(--night-2); }

/* ---------- Explanation panel ---------- */
.reading {
  flex: none;
  overflow: hidden;
  max-width: 0;
  max-height: 0;
  margin-left: 0;
  opacity: 0;
  transition: max-width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), max-height 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), margin 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.7s ease 0.25s;
}
.group.open .reading { max-width: 600px; max-height: 8000px; margin-left: 56px; opacity: 1; }
@media (min-width: 1000px) { .group.open .stagecard { position: sticky; top: 24px; } }
.reading-inner {
  width: 580px;
  padding: 30px 34px 34px;
  border-radius: 16px;
  border: 1px solid #d9b26a;
  background: rgba(255, 241, 204, 0.75);
  scrollbar-width: thin;
  scrollbar-color: rgba(62, 42, 30, 0.3) transparent;
}
.reading-inner:focus { outline: none; }
.reading h2 {
  margin: 0;
  font-size: 26px;
  line-height: 1.45;
  font-weight: 600;
  letter-spacing: 0.1em;
}
.reading .en {
  margin: 4px 0 20px;
  font-family: var(--script);
  font-style: italic;
  font-weight: 500;
  font-size: 24px;
  color: var(--leaf);
}
.reading p.para {
  margin: 0 0 1em;
  font-size: 17px;
  line-height: 2;
  letter-spacing: 0.03em;
  text-indent: 2em;
}
.reading p.para:last-child { margin-bottom: 0; }
.reading .ref { margin: 20px 0 0; font-size: 14px; line-height: 1.8; letter-spacing: 0.08em; color: var(--muted); white-space: pre-line; }

/* ---------- Controls ---------- */
.controls {
  min-height: 58px;
  display: grid;
  place-items: center;
}
.wait {
  display: grid;
  justify-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 15px;
  letter-spacing: 0.14em;
}
.track {
  width: 210px;
  height: 3px;
  border-radius: 3px;
  background: rgba(62, 42, 30, 0.15);
  overflow: hidden;
}
.track i {
  display: block;
  height: 100%;
  background: var(--sun);
  transform-origin: left center;
  transform: scaleX(0);
}
.wait.run .track i { animation: fill var(--wait) linear forwards; }
@keyframes fill { to { transform: scaleX(1); } }

.btn {
  appearance: none;
  font: inherit;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.22em;
  padding: 0.85em 2.2em 0.85em 2.42em;
  border-radius: 999px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.btn:focus-visible { outline: 2px solid var(--sun); outline-offset: 4px; }
.btn.primary {
  background: var(--sun);
  color: #fff1cc;
  animation: pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
}
.btn.primary:hover { box-shadow: 0 6px 18px rgba(62, 42, 30, 0.3); transform: translateY(-2px); }
.btn.ghost {
  background: transparent;
  color: var(--ink);
  border-color: rgba(62, 42, 30, 0.5);
  font-weight: 400;
  animation: pop 0.6s ease both;
}
.btn.ghost:hover { background: rgba(62, 42, 30, 0.08); }
@keyframes pop {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}

.group.instant, .group.instant * { transition: none !important; }

/* ---------- Narrow screens: stack card and text ---------- */
@media (max-width: 999px) {
  .table { padding-top: 26px; }
  .group { flex-direction: column; align-items: center; }
  .reading {
    width: 100%;
    max-width: 560px;
    max-height: 0;
    margin: 0;
    transition: max-height 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), margin 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.7s ease 0.25s;
  }
  .group.open .reading { max-width: 560px; max-height: 9000px; margin: 30px 0 0; }
  .reading-inner { width: 100%; padding: 24px 22px 26px; }
  .reading h2 { font-size: 23px; }
  .reading p.para { font-size: 16.5px; }
}

@media (prefers-reduced-motion: reduce) {

const WAIT_SECONDS = 10; // 翻牌後，等幾秒才出現「看解釋」按鈕

const CARDS = [{"id": "fairy_00", "zh": "小紅帽", "en": "Little Red Cap", "img": "cards/fairy_00.webp", "paras": ["故事中的小紅帽帶著天真與好奇踏上旅程，卻在途中受大野狼誘惑，忘了媽媽的叮嚀；最後她與奶奶被木匠救出，獲得重生。書中說，紅色代表意志與火焰，象徵靈性旅程剛起步與心智的力量；大野狼是意識中尚未整合的黑暗面，也是把人引離生命道路的誘惑。這張牌也被視為大阿爾克納牌的總結，代表內在孩童的靈魂正走上通往更高意識的啟蒙之路。抽到這張牌，請準備好上路冒險，並對未知保持開放。"], "ref": "傳統塔羅牌原型：愚人（The Fool）\n掌管的行星或星座：天王星\n詳見書中第 57 頁起"}, {"id": "fairy_01", "zh": "阿拉丁神燈", "en": "Aladdin and the Magic Lamp", "img": "cards/fairy_01.webp", "paras": ["阿拉丁奉魔法師之命進入地下庭園取油燈，摩擦戒指後精靈現身，帶他回到母親身邊；最後他以聰明才智擊敗了想霸占神燈的魔法師。書中說，神燈代表由精靈照亮的心性，精靈象徵靈性世界的力量與每個孩子的「天賦」潛能。牌中的神燈、寶劍、權杖與水晶聖壇，對應水、風、火、土四個元素。抽到這張牌，請從想法、文字與行動中創造屬於你的實相，多用創意而不只靠分析；也要留意肯定語的力量，保護自己不受負面思考影響。書中提醒，力量被放出後可能被誤用，但也能轉化為擴張意識的旅程。"], "ref": "傳統塔羅牌原型：魔術師（The Magician）\n掌管的行星或星座：水星\n詳見書中第 61 頁起"}, {"id": "fairy_02", "zh": "神仙教母", "en": "The Fairy Godmother", "img": "cards/fairy_02.webp", "paras": ["神仙教母牌相當於傳統塔羅的女祭司牌。書中提到，神仙教母雖不是格林版《灰姑娘》的主角，卻塑造了我們對魔法協助者的想像；在原版故事裡，長在灰姑娘母親墓上的榛樹就是她的魔法協助者，榛樹枝也成為保護人們的象徵。女祭司是神祕學的導師，握有通往內在庇護所的鑰匙，在古埃及對應愛希斯女神，與月亮的韻律相連。抽到這張牌，表示你的更高心智已知道答案，請相信直覺、培養信心；數字2代表靈性與物質、內在與外在的平衡，前方的旅程需要堅持，才能完成靈魂的功課。"], "ref": "傳統塔羅牌原型：女祭司（The High Priestess）\n掌管的行星或星座：月亮\n詳見書中第 65 頁起"}, {"id": "fairy_03", "zh": "鵝媽媽", "en": "Mother Goose", "img": "cards/fairy_03.webp", "paras": ["鵝媽媽對應皇后牌。書中指出，她下的金蛋與古埃及的金蛋神話相連，她的故事可追溯到埃及母親女神哈索爾所化身的尼羅河鵝；那顆金色的蛋就是太陽，也就是創造宇宙的世界之蛋。鵝媽媽是大地母親的擬人版，為人類靈魂帶來豐盛，也是心智意識（陽光）與情緒感受（月光）的「生育者」，讓我們與自然界合而為一。抽到這張牌，請對內在生育的潛能敞開：新的生命與新的開始即將實現，可留意夢中關於未來的線索，透過感官體驗喜悅，並讓植物的療癒力量修復身心。書中另提醒，本牌（3號）與傑克與魔豆（12號）關係特別密切。"], "ref": "傳統塔羅牌原型：皇后（The Empress）\n掌管的行星或星座：金星\n詳見書中第 69 頁起"}, {"id": "fairy_04", "zh": "國王的新衣", "en": "The Emperor’s New Clothes", "img": "cards/fairy_04.webp", "paras": ["國王牌是關於建立與建構的牌，與數字4有關，根源是對世俗力量的渴望，需要皇后牌的創造力來補足。書中說，若國王與母親女神（皇后）失去連結，就會出現危機；國王變得貪婪、盲目時，就成了愚昧的代表，穿著看不見新衣的國王正是例證，而說出真相的孩子，代表靈魂中永遠敬重真理的一面。書中也說，每個人內在都有男性與女性的力量，兩者結合，就能與神聖面向合一。抽到這張牌，請明白我們是從過去累積而來：皇后代表生命的智慧，國王則運用這份智慧讓世界更美好；他也可能象徵時間的限制、僵硬的規矩、盲目的行為，或是瞬間的覺醒。"], "ref": "傳統塔羅牌原型：皇帝（The Emperor）\n掌管的行星或星座：牡羊座\n詳見書中第 73 頁起"}, {"id": "fairy_05", "zh": "巫師", "en": "The Wizard", "img": "cards/fairy_05.webp", "paras": ["傳統塔羅的五號牌是教皇，也被稱為大祭司，連結到古埃及負責點化靈性學徒的高階祭司。在這副牌中，這個原型被定為巫師：不只是點化者，也是仁慈、敏銳、充滿慈悲的導師。書中以《綠野仙蹤》的奧茲巫師、梅林，以及《魔戒》的甘道夫為例；甘道夫引導佛羅多，也警告他至尊魔戒的危險，而佛羅多領悟到真正的力量不在魔戒，而在朋友組成的圈子。抽到這張牌，表示你身邊已出現一位靈性老師；請透過音樂、藝術、文學、哲學、宗教、歷史與自然探索更高層次的知識，傾聽高我，也不要為了達成目標而控制他人。"], "ref": "傳統塔羅牌原型：教皇（The Pope）\n掌管的行星或星座：金牛座\n詳見書中第 77 頁起"}, {"id": "fairy_06", "zh": "糖果屋——漢賽爾與葛麗特", "en": "Hansel and Gretel", "img": "cards/fairy_06.webp", "paras": ["傳統塔羅的六號牌是戀人牌，傳達的是在彼此承諾的關係中，信任與忠誠的重要；從更高的層次看，則是物質世界與靈性世界的平衡。故事中，被繼母與軟弱的父親丟在森林裡的兩兄妹，靠月光與白色的鳥指引前路；糖果屋象徵物質的誘惑、慾望與對性逐漸萌芽的意識，想吃掉他們的巫婆，則象徵必須被認出並淨化的意識黑暗面。葛麗特（靈魂）解救了漢賽爾（精神），兩人乘著白鴨跨過河水回家。抽到這張牌，表示深刻的靈性開端或結合可能正在發生；漢賽爾象徵阿尼姆斯（陽性），葛麗特象徵阿尼瑪（陰性），現在是讓內在陰陽兩面取得平衡的時候。"], "ref": "傳統塔羅牌原型：戀人（The Lovers）\n掌管的行星或星座：雙子座\n詳見書中第 81 頁起"}, {"id": "fairy_07", "zh": "彼得潘", "en": "Peter Pan", "img": "cards/fairy_07.webp", "paras": ["傳統塔羅的七號牌是戰車：車身象徵身體，承載著心智與精神；御夫代表內在自我；拉車的馬則是難以馴服、帶我們向前的基本意志。書中說，船在神話中常代表靈魂的載體；虎克船長與海盜象徵內心難以抑制的恐懼，叮噹仙子是我們內在的元素之靈。孩子們被勸誘留在夢幻島當不長大的孩子，但經歷冒險之後，我們仍須找到回家的路，回到自己的庇護所與靈魂家園。書中也提到，若要為凱龍星選一張牌，就是這張七號牌。抽到這張牌，請穩穩前行，看見隱而未見的資源，走中間的道路；允許自己作夢、勇敢冒險，再回到智慧的根源。"], "ref": "傳統塔羅牌原型：戰車（The Chariot）\n掌管的行星或星座：巨蟹座\n詳見書中第 85 頁起"}, {"id": "fairy_08", "zh": "美女與野獸", "en": "Beauty and the Beast", "img": "cards/fairy_08.webp", "paras": ["故事中，美女向父親要的禮物是一朵黑玫瑰，象徵深藏、未被看見的美；父親摘下玫瑰後遇見野獸，美女因此來到城堡。她看出野獸的善良，日漸同情，最後發現自己深愛著他；她的眼淚與無條件的愛解除了詛咒，野獸恢復成王子，因為這個魔法只有在有人真正看見他的靈魂之美時才能解除。書中說，這個故事的體悟是：美麗與否，由觀者定奪；在傳統塔羅中這張牌叫力量，常見圖案是女人打開獅子的嘴。抽到這張牌，請接受生命中愛的禮物，那份愛是用心感受到的，不是用眼睛看見的；請越過面具、人格與表面的分類去看見更深處，在黑暗中看見光，並對永恆之愛心懷感激。"], "ref": "傳統塔羅牌原型：力量（Strength）\n掌管的行星或星座：獅子座\n詳見書中第 89 頁起"}, {"id": "fairy_09", "zh": "白雪公主", "en": "Snow White", "img": "cards/fairy_09.webp", "paras": ["這個故事藏有為全人類服務與善用智慧區辨的課題。白雪公主被善妒的後母追殺，獵人心生同情放了她；她在森林裡找到小矮人的小屋，小矮人（地精）代表大地的智慧與地心閃現的內在之光，她也在照料他們的過程中日漸成熟。後母三次偽裝，用束腰布料、梳子與毒蘋果加害，公主因缺乏區辨力而次次上當；王子帶走她時，蘋果從喉嚨掉出，象徵清理喉輪後重新獲得原初的智慧，她也被賦予皇冠（頂輪），變得完整。在傳統塔羅中，這張牌是隱士。書中說，孤立分離的生活無法帶來滿足，靈魂的工作就是對全人類的服務。抽到這張牌，表示你已準備好接受來自祖先的智慧寶藏，你身邊也有靈性協助者，這是一張關於服務與深刻反思的牌。"], "ref": "傳統塔羅牌原型：隱士（The Hermit）\n掌管的行星或星座：處女座\n詳見書中第 93 頁起"}, {"id": "fairy_10", "zh": "愛麗絲夢遊仙境", "en": "Alice in Wonderland", "img": "cards/fairy_10.webp", "paras": ["愛麗絲的夢遊之旅從河邊開始，最後又回到原處，是一個完整的循環，因此讓人聯想到第十號牌命運之輪。書中說，命運之輪象徵人生的高低起伏、生生世世之間的時光之輪與投胎轉世；牌中白兔的懷錶強調時間的偉大循環，紅心皇后則提醒人要先把思考擺在一旁，潛入生命脈動最強烈之處。愛麗絲夢遊仙境正好是大阿爾克納的第十張，也是整副牌旅程的中間點。書中也提到，這個故事點出「人生如夢」的主題，作者路易斯．卡羅是為愛麗絲．李道爾寫下了它。抽到這張牌，請從更高的角度看待人生，探索夢境與願景，期待命運之輪帶來轉機、保持樂觀，並把握即將來到的良機。"], "ref": "傳統塔羅牌原型：命運之輪（The Wheel of Fortune）\n掌管的行星或星座：木星\n詳見書中第 97 頁起"}, {"id": "fairy_11", "zh": "點石成金", "en": "The Midas Touch", "img": "cards/fairy_11.webp", "paras": ["第十一號牌的主角一直是一位女性，右手持代表靈性力量的長劍，左手持代表神聖正義的秤，古希臘稱她泰美斯，古埃及稱她瑪亞特；人在進入來世前，靈魂要被放上天庭之秤，經歷「因果清算」。故事中，麥達斯國王向陌生人許願，要碰到的一切都變成黃金；願望成真後，連心愛的女兒也變成了金像。後來他依陌生人的指示，用花園水池深處的水淨化貪婪與驕傲，再把水倒在變成金的物品上，才讓一切恢復原狀。書中說，還有比金錢更珍貴的事物，也要三思自己的行動，因為內心深處的願望可能成真，卻帶來更多悲傷。抽到這張牌，請檢視主宰你生活的原則，依至善的原則規畫生活；所有行為都會帶來相應的回報，因果業報是無上真實的法則。"], "ref": "傳統塔羅牌原型：正義（Justice）\n掌管的行星或星座：天秤座\n詳見書中第 101 頁起"}, {"id": "fairy_12", "zh": "傑克與魔豆", "en": "Jack and the Beanstalk", "img": "cards/fairy_12.webp", "paras": ["第十二號牌是吊人：倒掛的人象徵轉換看待生命的角度，以及自我與精神合一的需要，也與神話中即將赴死的救世主有關。故事中，傑克用家裡的牛換回魔豆，豆子被母親扔進花園，一夜長成通天的豆莖；他爬上天上的城堡，帶回會下金蛋的母雞、一袋錢，以及一把魔法豎琴，最後砍斷豆莖，讓巨人摔死。書中說，這張牌的主題是交託與臣服：傑克交出牛，就不再服膺世界既有的邏輯，母親的哭泣也是一種釋放；故事中的巨人可能象徵各種恐懼或未知。抽到這張牌，請用全新的角度看待人生與親密關係，並透過觀想讓自己更清晰；你只需要想通一點點，就足以征服如巨人般的難題。請翻開人生的新篇章，順著流走，臣服於你的靈性道途。"], "ref": "傳統塔羅牌原型：吊人（The Hanged Man）\n掌管的行星或星座：海王星\n詳見書中第 105 頁起"}, {"id": "fairy_13", "zh": "睡美人", "en": "Sleeping Beauty", "img": "cards/fairy_13.webp", "paras": ["故事中，未受邀請的第十三位仙女（黑仙女）詛咒公主會被紡錘針刺死，後來詛咒被改為沉睡一百年，直到騎士以一個吻喚醒她與整個王國。書中說，這個故事談的是從青澀走向成熟的漫長過程：紡錘刺破手指流出的血象徵少女的經血，沉睡的橋段強調接納性，看似沒有事情發生的那些年，內在其實正經歷深刻的轉變。這樣的「生命轉變」就像死亡與重生；塔羅的死神牌正好是第十三號，而書中指出，死亡不會帶走內在的靈魂與神性之光，它像一場長長的睡眠，我們終將醒來。抽到這張牌，你將需要一段長時間的沉澱與思考，請帶著勇氣與平靜探索夢境與象徵，用接納的態度學習、放下過去，像毛毛蟲化為蝴蝶般經歷內在的變身；書中也提醒，睡眠有療癒的力量。"], "ref": "傳統塔羅牌原型：死神（Death）\n掌管的行星或星座：天蠍座\n詳見書中第 109 頁起"}, {"id": "fairy_14", "zh": "守護天使", "en": "The Guardian Angel", "img": "cards/fairy_14.webp", "paras": ["傳統塔羅的第十四號牌是節制：圖案中的天使一腳踏地、一腳踩水，在兩個杯子之間傾倒仙劑，代表精神與靈魂能量的結合，也像是把神性之光與智慧注入人性的煉金過程。在這副牌中，這張牌由守護天使表現，祂是在孩子成長過程中看顧他們、在危機時提供保護與療癒的靈性存有。書中說，光環象徵這些存有身上帶有靈性之光；守護天使是我們之外保護我們的力量，也是靈魂的另一種面向，甚至可能是高我；童話中的神仙教母、解圍的巫師與好仙女，都是祂的化身。抽到這張牌，請敞開心與頭腦，接受能幫你恢復平衡的溫柔韻律；人生有重大改變時，我們都需要保護與指引。當你請求更高力量的協助，祂們就會前來，溫柔地擁抱你。"], "ref": "傳統塔羅牌原型：節制（Temperance）\n掌管的行星或星座：射手座\n詳見書中第 113 頁起"}, {"id": "fairy_15", "zh": "大野狼", "en": "The Big Bad Wolf", "img": "cards/fairy_15.webp", "paras": ["第十五號牌在傳統塔羅中是惡魔牌，在這副牌中由大野狼代表。書中指出，大野狼與狐狸常是童話裡黑暗、作惡的化身，象徵人聰明才智中狡詐與惡作劇的一面，也象徵每個人潛意識的陰暗面，以及人類集體意識中尚未啟蒙的黑暗；這一面若佔上風，終究會導致自我毀滅。書中說，當人接受自己的黑暗面並把它融入光中，療癒就會發生，那裡也藏著靈性整合的種子。牌中的大野狼躲在樹後，眼前是一片貧瘠的森林，遠方有一座塔；牠必須走進月光下，才能獲得療癒。抽到這張牌，請擁抱你的恐懼、懷疑與尚未整合的部分，用光照亮心靈的黑暗地帶；把憤怒、忌妒與憎惡轉化成喜悅、慈悲與理解，也別再對自己或他人說謊，只說真實的話。"], "ref": "傳統塔羅牌原型：惡魔（The Devil）\n掌管的行星或星座：摩羯座\n詳見書中第 117 頁起"}, {"id": "fairy_16", "zh": "長髮公主", "en": "Rapunzel", "img": "cards/fairy_16.webp", "paras": ["第十六號牌的主題一直是被雷擊中的高塔，象徵除去自我中心的意識，並認知到物質基礎不是靈性生活的根本。故事中，長髮公主十二歲起被女巫關在沒有門的高塔；王子聽見她的歌聲，沿著她的長髮爬上塔，女巫發現後剪斷長髮，把她丟到荒漠，並害王子跌入荊棘叢而失明；最後兩人在沙漠重逢，她的眼淚讓王子恢復視力。書中說，她的歌聲代表喉輪的覺醒，長髮與自我意識的發展有關，荒漠中的生活是新生活的開始，盲眼的王子則意味著要停止向外追逐、避免過度依賴感官，轉而向內發展直覺。抽到這張牌，請準備迎接轉變；清除來自小我的舊有慾望、恐懼與不滿，切斷來自過去的牽絆與業力的連結，讓自己純淨而清晰地重獲新生。"], "ref": "傳統塔羅牌原型：塔（The Tower）\n掌管的行星或星座：火星\n詳見書中第 121 頁起"}, {"id": "fairy_17", "zh": "星願", "en": "Wishing Upon a Star", "img": "cards/fairy_17.webp", "paras": ["書中先回顧前面幾張牌：越過死亡門檻、與守護天使合一、遇見黑天使、在塔中得到淨化；到了第十七號牌星星，神性之光、智慧與愛重新被點亮。古人視星星為有生命的存在，有時被認為是天上的天使；「如其在上，如其在下」這句格言，則說明小宇宙反映大宇宙。對著星星許願，是再一次與生命中更高的力量連結；孩子的願望是想像力的展現，想許願的衝動本身就帶有魔力，當我們相信自己值得，夢想通常會以不同的形式成真。書中也提醒，許願要有意識，因為願望本身就具有力量。抽到這張牌，重要的願望或期盼可能很快實現；請對天上那個更高層級的自己敞開，到戶外與星星連結，記得你的本質是靈魂之光，並用生活活出你真心想實現的命運。"], "ref": "傳統塔羅牌原型：星星（The Star）\n掌管的行星或星座：水瓶座\n詳見書中第 125 頁起"}, {"id": "fairy_18", "zh": "灰姑娘", "en": "Cinderella", "img": "cards/fairy_18.webp", "paras": ["書中說，第十八號月亮牌一直與雙魚座相關；雙魚座連結雙腳與立足之處，也有自我犧牲與受苦的主題，同時與夢想有關。灰姑娘參加宴會，象徵孩子想長大、進入更大的社會並遇見王子的夢想得以實現。月亮牌也提醒我們，想像力、幻想與深層情緒具有鮮活的力量。在較原始的故事版本中，仙杜瑞拉只向父親要了一根樹枝，栽在母親的墓上長成榛樹，她的眼淚就是樹成長的水分，樹上的鳥兒是她的天使協助者；書中說，感受、源頭與母親，都與月亮有關。這個故事也提醒，靈魂（灰姑娘）與精神（王子）永遠是不可分的一對。抽到這張牌，請探索內在深處對過去、家庭、母親與困頓生活的感受，認知哀痛與謙卑的重要，因為它們能帶我們走向更深刻的喜悅；若有淚，就讓它流下，眼淚是生命的泉源。"], "ref": "傳統塔羅牌原型：月亮（The Moon）\n掌管的行星或星座：雙魚座\n詳見書中第 129 頁起"}, {"id": "fairy_19", "zh": "黃磚路", "en": "The Yellow Brick Road", "img": "cards/fairy_19.webp", "paras": ["第十九號牌通常是太陽牌，象徵太陽是地球的生命之源；書中說，太陽牌常畫著孩子，提醒我們要接近神性，就要像孩子一樣純真無邪、自在開心。在這副牌中，「黃磚路」代表通往更高智慧與靈性真相的道路：桃樂絲與托托沿著黃磚路前往奧茲國，途中遇見稻草人、鐵皮人與膽小獅；好魔女、壞魔女與巫師等人物，則代表朝聖者一路上可能遇見的各種意識狀態。奧茲國象徵高我、成年與人在太陽系中真正的靈魂之家，最終的目的地是「家」，代表靈魂的覺醒、靈性之光與智慧。抽到這張牌，表示一道太陽之光正在為你的生活引路；請讓金黃之光填滿心靈的暗角，踏上黃磚路追尋更高的目標。你所尋找的一切都在觸手可及之處，無論犯過多少錯、面臨什麼困難，你依然是照亮這世界的明燈。"], "ref": "傳統塔羅牌原型：太陽（The Sun）\n掌管的行星或星座：太陽\n詳見書中第 133 頁起"}, {"id": "fairy_20", "zh": "三隻小豬", "en": "The Three Little Pigs", "img": "cards/fairy_20.webp", "paras": ["第二十號牌在許多塔羅版本中，畫的是大天使加百列吹號角、人們從墓中站起，象徵靈性重生與審判之日；書中也說，這張牌提醒我們要用智慧與區辨力戰勝潛在的敵人，專心走自己的靈性道路。三隻小豬分別用稻草、樹枝與磚塊蓋房子，前兩棟被大野狼吹倒，磚房則屹立不倒；三次被誘騙時，小豬都以聰明才智脫身，最後大野狼從煙囪爬進，被壁爐裡滾燙的水燙死。書中說，大野狼象徵的自私、貪婪與憎惡，終究會在激烈的淨化中被轉化；小豬代表人類的抱負，大野狼則是世上強大的邪惡與混亂力量。抽到這張牌，請以實際的角度建構你的周遭世界，讓靈性、心理、情緒與現實生活都建立在真實與智慧之上；創作時質重於量，重要的決定要三思，也別再浪費力氣評斷別人。"], "ref": "傳統塔羅牌原型：審判（Judgement）\n掌管的行星或星座：冥王星\n詳見書中第 137 頁起"}, {"id": "fairy_21", "zh": "大地之子", "en": "The Earth Child", "img": "cards/fairy_21.webp", "paras": ["傳統塔羅的最後一張是世界牌，在這副牌中稱為大地之子，是尚未誕生、正準備重生的靈魂，也是漫長旅程累積的成果。書中說，降生於物質世界意味著必須經歷痛苦，而痛苦也是讓地球上的人們團結的共同紐帶；這張牌由土星掌管，土星象徵紀律、責任、專注、勤奮，以及消除「舊有業力」。書中也指出，本牌（21號）與第十二號牌傑克與魔豆有特殊的關聯：豆莖像連結母親與孩子的臍帶，而胚胎靈魂有意識地決定再次承擔身在地球的苦難，準備好透過誕生的轉化回到愚人（0號牌）；這二十二張牌是一趟循環之舞，而不是線性的旅程。抽到這張牌，表示極具影響力的神聖力量正在你的氣場中孕育成形；請敞開擁抱，記得你從來都不孤單，一直有看不見的協助者與指引在看顧你，並讓孩子般的驚奇充滿生活。"], "ref": "傳統塔羅牌原型：世界（The World）\n掌管的行星或星座：土星\n詳見書中第 141 頁起"}, {"id": "wands_00", "zh": "魔杖一", "en": "Ace of Wands", "img": "cards/wands_00.webp", "paras": ["牌面是一隻蝴蝶，兩位仙子正在揭開它的面紗，代表偉大的靈魂潛能顯現。書中提到，希臘神話認為靈魂與蝴蝶有關，威爾斯神話稱仙子為「母親」與「協助者」，在中國，蝴蝶雙飛則有靈魂成雙的意涵。這張牌象徵從過往傷痛中重新站起、帶著新的意識破繭而出，也提醒愛、靈魂的結合與藝術正進入你的生活，現在是展現真正色彩的時候。"], "ref": "詳見書中第 153 頁起"}, {"id": "wands_01", "zh": "魔杖二", "en": "Two of Wands", "img": "cards/wands_01.webp", "paras": ["牌面是一位仙女在水邊看著自己的倒影。書中說，世界各地都有倒影反映靈魂重要部分的信念；她不像希臘神話的納西賽斯那樣迷戀倒影，而是與「深愛的自我」合一，從中看見神聖之美的潛能。這張牌指出你正準備面對真正的自我，書中建議找個能獨處的地方，探索隱藏的才能，或透過觀想看看自己真正的樣貌。"], "ref": "詳見書中第 155 頁起"}, {"id": "wands_02", "zh": "魔杖三", "en": "Three of Wands", "img": "cards/wands_02.webp", "paras": ["三位仙女在桃枝之間拉小提琴，慶祝三態女神所賜的靈感繆思。書中提到，希臘的記憶女神尼莫西妮代表內在的神聖天賦，三位繆思帶來清晰的洞察與直覺的技巧；在中國，桃枝是製作魔杖的材料，桃樹與金星相關，代表藝術、音樂與愛。這張牌提醒你憶起心中的繆思，敞開來享受藝術的喜悅：你的喜悅與生活的喜悅，都是可能的。"], "ref": "詳見書中第 157 頁起"}, {"id": "wands_03", "zh": "魔杖四", "en": "Four of Wands", "img": "cards/wands_03.webp", "paras": ["四位仙女在花園裡整理土壤、播下種子。書中以種子為比喻：生命力蘊藏在小小的種子裡，可以用來形容知識、真理與意識的孕育。花園的四個角落代表四季與四方，牌中的仙女代表春天，也就是播種的季節。這張牌指的是種下新的智慧、重建直覺的根基；你的生活中有新想法正在成形，請種下創意，等它發芽茁壯。"], "ref": "詳見書中第 159 頁起"}, {"id": "wands_04", "zh": "魔杖五", "en": "Five of Wands", "img": "cards/wands_04.webp", "paras": ["牌中的仙女像是羅馬花神芙蘿拉，她掌管一切開花與繁茂生長的事物，每年五月一日的五朔節是她的節日。書中提到煉金術士稱五瓣花為「神聖子宮」。這張牌說你內在的陰性面正在滋長，適合作畫或畫曼荼羅；眼前的境遇不是苦難，而是一支舞、一份讓創意與直覺展開的禮物。有些改變即將到來，關鍵是讓自己打開。"], "ref": "詳見書中第 161 頁起"}, {"id": "wands_05", "zh": "魔杖六", "en": "Six of Wands", "img": "cards/wands_05.webp", "paras": ["五朔節時，大地鋪滿綠意，掌管這個季節的是少女女神芙蘿拉。人們立起花柱、圍著它跳舞，既是迎接春天，也是承認人類的神聖子宮，並向自然母親表達感謝。書中也提到，光明節、聖尼可拉斯節這類古老儀式能強化社群的融洽。牌中的少女仙子們唱歌跳舞，迎接自己豐饒的創造力；現在是展現熱情、明白自己是生命循環中重要一環的時候。"], "ref": "詳見書中第 163 頁起"}, {"id": "wands_06", "zh": "魔杖七", "en": "Seven of Wands", "img": "cards/wands_06.webp", "paras": ["這是一張療癒的牌。書中說，花仙子掌管花朵的療癒知識，因為振動頻率很高，人們常看不見祂們；祂們透過像巴赫花精這樣的介質，把花的精華獻給人類。牌中七隻不同顏色的蝴蝶，代表人體的七個脈輪，透過冥想與深呼吸能喚醒昆達里尼，為身、心、靈帶來健康。你或許已準備好探索脈輪療癒或花精療法，多到大自然裡走走，療癒自己之後，也能成為身邊人的療癒師。"], "ref": "詳見書中第 165 頁起"}, {"id": "wands_07", "zh": "魔杖八", "en": "Eight of Wands", "img": "cards/wands_07.webp", "paras": ["書中提到，風、火、水、土四個元素中，火是最輕盈的，儀式中常用它強調轉化、淨化與靈性的覺醒。牌中的八位仙子被點化進入火的典禮，魔杖也在此刻被重新煉金轉化、注入能量，最終被喚醒的是這世界的光。這張牌提示，現在或許適合與某個團體重新相聚、回到家庭，或與超越個人的意識重新連結；火可以摧毀，也可以療癒，請成為一個帶著光的人。"], "ref": "詳見書中第 167 頁起"}, {"id": "wands_08", "zh": "魔杖九", "en": "Nine of Wands", "img": "cards/wands_08.webp", "paras": ["書中說，生命中總有些時候，通往新意識的大門會出現在面前，帶我們進入內在智慧的神奇花園。牌中的仙子正準備打開花園的大門，門後有藥草、花朵與樹林，能為她充電與療癒；柵門上的蝴蝶代表她靈魂中準備蛻變的面向。抽到這張牌，表示你正在探索通往內在心靈的秘密通道，或是重要的進化旅程正走到循環的尾聲。書中建議閉上眼睛，想像自己走進內在的花園。"], "ref": "詳見書中第 169 頁起"}, {"id": "wands_09", "zh": "魔杖十", "en": "Ten of Wands", "img": "cards/wands_09.webp", "paras": ["這張牌接續魔杖九：仙子已進入花園，體驗到重回靈性家園的感受。柵欄上的九隻蝴蝶化成白色的蝴蝶之冠，成為她神性的光環、保護與指引；魔杖頂端的彩虹蝴蝶，象徵她進入更高意識的狀態。書中提到，數字9代表完結，10代表返老還童。仙子準備好用直覺的技巧承擔新的責任，例如療癒、藝術、音樂、舞蹈與儀式；書中也說，你的氣場正在被淨化。"], "ref": "詳見書中第 171 頁起"}, {"id": "wands_10", "zh": "魔杖孩子：小王子", "en": "Child of Wands: The Little Prince", "img": "cards/wands_10.webp", "paras": ["書中以聖修伯里的《小王子》說明，小而溫暖的禮物能為生活帶來深刻的不同：小王子從迷你行星來到地球，用簡單的話語改變了一個男人的人生，最後把一顆星星送給他當禮物。小王子就是我們每個人內在的星星小孩。這張牌代表一份美好的禮物、一份甜蜜的愛正出現在你的生活中；書中建議在月光下散步，抬頭看星星，看看它們是否正對你微笑。"], "ref": "詳見書中第 173 頁起"}, {"id": "wands_11", "zh": "魔杖追尋者：綠野仙蹤——桃樂絲", "en": "Seeker of Wands: Dorothy", "img": "cards/wands_11.webp", "paras": ["書中以《綠野仙蹤》的桃樂絲為例：她被龍捲風帶到遠方，為了見奧茲巫師而踏上內在旅程，途中遇見好巫婆、壞巫婆、膽小獅、鐵皮人與稻草人，最後在北方好魔女的指引下回到家，明白答案一直在自己心中；書中也說，旅途的過程仍是必經的經歷。這張牌鼓勵你跟隨命運之流、增強信心與靈性力量、記錄夢境，也許適合出門旅行；別害怕迷路或犯錯，協助者與引導者會指引你回家的路。"], "ref": "詳見書中第 177 頁起"}, {"id": "wands_12", "zh": "魔杖指引者：魔笛手", "en": "Guide of Wands: The Pied Piper", "img": "cards/wands_12.webp", "paras": ["哈梅林鎮鼠患成災，魔笛手答應用笛聲趕走老鼠，村民事後卻沒有履行承諾，於是他用笛聲帶走了村裡的孩子，只有一個跛腳的孩子沒能趕上。書中說，這張牌提醒你不知道繆思何時出現、何時離開；跛腳的孩子象徵每個人獨一無二的表達方式，村民則因為忽視創意的價值而付出代價。抽到這張牌，表示是聽從內在指引的時候，不必跟著外界領袖的旋律；書中建議去玩、去跳舞、唱歌，讓創意綻放。"], "ref": "詳見書中第 181 頁起"}, {"id": "wands_13", "zh": "魔杖守護者：大天使拉斐爾", "en": "Guardian of Wands: Raphael", "img": "cards/wands_13.webp", "paras": ["書中先介紹天使的九個等級，以及四位主要的大天使：拉斐爾、麥可、加百列與烏瑞爾。拉斐爾是庇護天使，看顧人類，並為受苦的靈魂提供指引與照料；名字意思是「神能療癒」，也常被描繪成拿著長杖、穿著拖鞋的旅人守護者，並掌管春天。抽到這張牌，表示你正被帶著神聖療癒力量的存有照看；書中建議認知雙手的療癒力量、為世界各地的人祈福、多交新朋友，並耕耘信仰與慈愛之心。"], "ref": "詳見書中第 185 頁起"}, {"id": "swords_00", "zh": "寶劍一", "en": "Ace of Swords", "img": "cards/swords_00.webp", "paras": ["牌面描述少年亞瑟在比試中，從鐵砧裡拔出神奇之劍，因而成為合法的王位繼承人。書中說，寶劍長久以來象徵統治與力量，但它更代表戰勝恐懼與自我懷疑的靈性意志，以及清晰的意志、直覺力與更高的心智品質；孩子握著寶劍走上命運道途，會學習字母、詞彙與表達的藝術，因為人類的語言就是神聖真理之劍的延伸，寶劍也可能化為樂器、智慧之杖或啟發靈感的鋼筆。抽到這張牌，請運用專注思考的力量，掌握神聖的意志來克服負面想法，順應命運之流，明白自己是帶著清晰的目的來到這世界。新的思考方式即將出現，或是幻象將要消失；也可能是開始一項運用心智的計畫，例如寫一本書或展開一趟旅程。"], "ref": "詳見書中第 189 頁起"}, {"id": "swords_01", "zh": "寶劍二", "en": "Two of Swords", "img": "cards/swords_01.webp", "paras": ["書中以雙人劍術作比喻：劍士需要技巧與優雅，也要懂得屈服的藝術；我們的心智也是如此，但現代文化強調二元思考，讓人常陷入猶豫與自我懷疑，光是處理內在衝突就已耗盡力氣。牌中交叉的兩把寶劍代表心智上的衝突，閃亮的太陽則提醒，在任何二元對立的背後，永遠有一個一體性在照看。書中建議像體驗運動那樣看待心智的衝突，平衡與整體性最重要；生活中的一切都有相對的兩端，必須明白其中一端，才能學會另一端。抽到這張牌，也許是為舊問題做出新決定或尋求答案的時候；請走向你的光與智慧，讓答案像日出一樣自然浮現，讓舊有的憂慮像日落般沉入過往。當你輕輕臣服於此時此刻，清晰就會到來。"], "ref": "詳見書中第 193 頁起"}, {"id": "swords_02", "zh": "寶劍三", "en": "Three of Swords", "img": "cards/swords_02.webp", "paras": ["牌面是一位少女把玩著三把小劍組成的三角形，窗台上有一隻鳥聆聽著她奏出的樂音，象徵自由。書中說，在傳統塔羅中，寶劍三帶有壓力與困惑，通常被解釋為失去摯愛，但真正失去的其實是對自己的愛，因為人與心失去了連結；這時需要讓心輪與頂輪重新連結，內在的交響樂才能響起。數字3象徵和諧與溝通，三角形代表身、心、靈的三位一體，後方的城牆則象徵阻隔美麗靈魂特質表達出來的心理結構。書中提醒，意念是你的盟友，可以像演奏交響樂一樣運用念頭：恐懼是鼓，希望是小提琴，勝利是小號；別讓反覆的自我懷疑打亂和諧的旋律。從實際層面看，這也意味著把音樂帶進生活，彈奏樂器或聽喜歡的音樂，聲音本身就有療癒的力量。"], "ref": "詳見書中第 195 頁起"}, {"id": "swords_03", "zh": "寶劍四", "en": "Four of Swords", "img": "cards/swords_03.webp", "paras": ["牌面中，一個男孩乘著木筏在水上垂釣。書中說，木筏代表新構建的心念，來自尚未完全成形、正在萌芽的意識；深水代表過去，浮現的則是內在的真實與對自由的渴望。更高層次的知識還在遠方，目前只看得見一部分；在這張牌中，自由與形式優雅地並行，白鴿正引領男孩前行。抽到這張牌，請把自己想成漁夫，把釣線放進未知的生命之流，深化你的知識，並學著複製河流寧靜的韻律，不必催促自己；當內在生起想建立新覺知基礎的衝動，成熟度就會到來，不論你幾歲。這張牌也代表一段休息的時間，或是更寧靜的氛圍能改善生活品質；當深度的轉變開始，請保有內在的平靜。"], "ref": "詳見書中第 197 頁起"}, {"id": "swords_04", "zh": "寶劍五", "en": "Five of Swords", "img": "cards/swords_04.webp", "paras": ["這張牌接續寶劍四：木筏已經靠岸，釣線或寶劍插在沙地裡，男孩開始探索眼前未被揭露的真實。書中說，數字5與自由、冒險，以及生命道路上出乎意料的改變有關；岸上的海豹是先前未被發現的生命力，如今展露頭角；男孩身後天空中璀璨的太陽，象徵清明的意識已經浮現。抽到這張牌，請明白真理與自由都在前方等著你；自由若被誤用，會造成困惑與混亂，所以要弄清楚自己的位置與目標，並像男孩踩在濕滑的石頭上一樣小心前行。現在適合發揮創意、訂定目標，並把注意力集中在念頭上，期待從內在深處得到帶來啟發的洞見。"], "ref": "詳見書中第 199 頁起"}, {"id": "swords_05", "zh": "寶劍六", "en": "Six of Swords", "img": "cards/swords_05.webp", "paras": ["牌中的孩子們做出戲劇化的致敬動作，為找到團結合一與成功的精神力量喝采；每個孩子手中都有聖杯與寶劍，聖杯代表心的力量，寶劍代表心智的力量。書中說，我們已到達終點，新的清晰意識被找到，有專注的目標、團結合一的願景、責任感、忠誠與不變的友誼；當意識達到這個層級，個人與群體的理想融為一體，就能共同完成服務地球的使命。抽到這張牌，表示你已達到顛峰，心智充滿遠見與靈感，像溫暖的陽光把負面思考與恐懼的水氣蒸發殆盡；請挺起身子、閉上眼睛，讓太陽之火的光芒成為智慧的基礎，感受神聖的金光包圍並保護你。現在是用清晰的遠見服務全人類的時候。"], "ref": "詳見書中第 201 頁起"}, {"id": "swords_06", "zh": "寶劍七", "en": "Seven of Swords", "img": "cards/swords_06.webp", "paras": ["牌中的年輕學者正著手解開神聖知識之謎，代表一段沉思的時期即將開始。孩子望向窗外平靜的景色與遠方航行的船，反映他眼前展開的視野；他手中的筆是寶劍的形狀，幫助他寫下獨處中浮現的真理與洞見；面前的書本集結了古老的教誨，卷軸在神祕學中象徵時間：已展開的部分是現在，兩端則是被遮蔽的過去與未知的將來。抽到這張牌，也許是開始新的研究或學習，或重新點燃對某個計畫或領域熱愛的時候；這是適合安靜反思的時光，內在指引正在運作，適合閱讀、寫作與探索想像力。請珍惜獨處的時間，也可以了解靜心、沉思或觀想的技巧，並在內在找到一個平靜的空間。"], "ref": "詳見書中第 203 頁起"}, {"id": "swords_07", "zh": "寶劍八", "en": "Eight of Swords", "img": "cards/swords_07.webp", "paras": ["牌中的孩子走在洞穴或迷宮裡，代表朝向未知領域的靈魂旅程；迷宮通常只有一條蜿蜒的路通往最終目標，常用於啟蒙儀式。書中說，深度轉化發生時，我們常被引導進入內心的隱密之處，去化解舊有的業力模式與潛藏的恐懼；東方神祕家說，真實的自我住在心的洞穴裡。牌中的蜘蛛與蛛網象徵心智不斷編織、重塑念頭；盤成8字形（無限符號）的蛇，則是內在的靈通力與生命力，讓人想起沿著脊椎流動、沉睡在海底輪的昆達里尼能量。抽到這張牌，你或許覺得這是一段考驗的時期；請把憂慮放一旁，因為你正踏上神聖的旅程，只要願意面對恐懼偽裝的面孔，就能克服它。請照亮阻礙你的深層恐懼，並準備好面對它們的意義；隧道的盡頭永遠有光。"], "ref": "詳見書中第 205 頁起"}, {"id": "swords_08", "zh": "寶劍九", "en": "Nine of Swords", "img": "cards/swords_08.webp", "paras": ["草地上的孩子被九把寶劍圍繞，象徵他無法看見自己所創造、用來限制自己的心智結構之外的景象；一條奇幻的龍也圍在他身邊，那是他尚未認出的盟友，卻被他誤當成敵人。書中說，當孩子準備好抬頭面對這條龍，就會明白牠是自己尚未整合的強大面向。數字9代表完成，舊的念頭已準備消散；當孩子溫柔地讓龍進入心中，寶劍會一把把倒下，但仍需尊重這些寶劍，因為它們保護他免受尚未準備好吸收的痛苦與智慧。在中國道家的象徵中，龍是指引「道」的靈。抽到這張牌，請在內在尋找那條富有想像力的龍，讓牠引導你走向轉化後的未來目標；留意自己如何用限制性的想法或僵化的觀念武裝自己，並願意輕柔而充滿愛地打開，完成這個受困的循環。"], "ref": "詳見書中第 207 頁起"}, {"id": "swords_09", "zh": "寶劍十", "en": "Ten of Swords", "img": "cards/swords_09.webp", "paras": ["牌面瀰漫著自由與解放的氣息：孩子已長成騎士，並接受了自己的內在力量。書中說，在寶劍九，龍因為孩子被恐懼蒙蔽而困住他；在寶劍十，龍則被男孩的寶劍圍繞，象徵他整合了克服恐懼與壓迫所需的力量與勇氣；當他把第十把劍插入地面，圍著龍的劍便成為一個完整的圓圈，意味著他達到心智、靈性與物質的合一。抽到這張牌，表示你可以自由地探索新一輪的意識覺知；你已付出許多努力克服心智的阻礙與緊張，也更明白清除負面想法需要多少勇氣，因為你已面對過自己內在的龍。生命的循環仍在繼續，你已準備好迎接新的冒險；請運用累積的經驗與智慧，時時滋養自己，並用善良與愛的想法灌注強大的心智。"], "ref": "詳見書中第 209 頁起"}, {"id": "swords_10", "zh": "寶劍孩子：木偶奇遇記——皮諾丘", "en": "Child of Swords: Pinocchio", "img": "cards/swords_10.webp", "paras": ["書中引述哲學家的話：刻出皮諾丘的那塊木頭，就是人性本身，提醒我們每個人在實現偉大夢想的過程中都可能犯錯，而孩子喜歡皮諾丘，因為他就像他們一樣。故事中，貧窮的木匠傑佩托刻出一個會說話的木偶，他魯莽又自私，一說謊鼻子就會變長；他想上學，卻又被誘惑「跟隨音樂走」，也就是跟著自己的繆思，因而偏離受教育的路，經歷各種災難後，終於學會無私的愛與奉獻的美德。書中說，皮諾丘學到的正是每個人在成熟路上要學的課題；當我們開始擺脫年輕的無知，就可能抽到這張牌。抽到這張牌，請檢視「真實」在你生活中的力量：你有多誠實？與長久以來說謊、欺騙與自我蒙蔽的模式做個了斷，清楚看見鏡中的自己，運用寶劍所代表的靈性意志與心智紀律，走在自己的命運道途上。"], "ref": "詳見書中第 211 頁起"}, {"id": "swords_11", "zh": "寶劍追尋者：綠野仙蹤——稻草人", "en": "Seeker of Swords: The Scarecrow", "img": "cards/swords_11.webp", "paras": ["書中說，木偶皮諾丘與《綠野仙蹤》的稻草人都不完全是人類，都在努力發展自己思考的能力；稻草人一開始毫無頭緒，走上黃磚路後變得機智聰明，直到見到巫師時才意識到自己的智慧早已顯現，桃樂絲離開時說最會想念他，顯示聰明與清晰的思考是高貴而重要的。牌中的兩把劍代表缺乏目標、內心衝突與二元思考，最終都會回歸和諧；向日葵象徵實現個人命運的潛力，稻草人被畫成一株向日葵，正在培養自己的意志力與清晰的思考。他想起人生使命後，戰勝壞魔女、幫助桃樂絲，才準備好用心智去服務更廣大的世界，不再只想著自己。抽到這張牌，請對自己的心智能力更有自信，必要時擴充詞彙、閱讀字典、學習新語言，做些正向的事來豐富你的智能；別遲疑，也別猶豫不決，機會永遠屬於有遠見、有智慧的人。"], "ref": "詳見書中第 215 頁起"}, {"id": "swords_12", "zh": "寶劍指引者：羅賓漢", "en": "Guide of Swords: Robin Hood", "img": "cards/swords_12.webp", "paras": ["羅賓漢與他的快活好漢們生活在十二世紀英國的森林，是專門劫富濟貧的法外之徒，被當地薩克遜人視為英雄；他也是當時首屈一指的傳奇弓箭手與劍客。書中說，在腐敗、充滿政治陰謀的時代，他們成了正義、人道服務與善意的化身；寶劍指引者這張牌代表對自己的人民或群體的理解、智慧與愛已真正融合：在皮諾丘只看到這樣的可能性，在稻草人看到部分的實現，到了羅賓漢則已成為一種生活方式。書中還提到，三百多年後的聖女貞德是另一位寶劍指引者。牌中的羅賓漢佩著真實之劍，背後的箭代表更高意識與目標導向。抽到這張牌，請專心跟上他的腳步，掌握生命道路上的主動權與新計畫，幫助需要的人，向他人傳授正義、公平、平等與榮譽的價值，去森林走走，與大自然和諧共處，並記得那句古諺：「真相會讓你自由」。"], "ref": "詳見書中第 219 頁起"}, {"id": "swords_13", "zh": "寶劍守護者：大天使麥可", "en": "Guardian of Swords: Michael", "img": "cards/swords_13.webp", "paras": ["書中說，大天使麥可一直被視為天界的統領，可能就是約書亞在耶利哥之戰前遇見的「持劍的天使」；《啟示錄》中，祂持著長劍率領天使與遠古之龍大戰。麥可是靈性力量與意志在天庭的化身，名字意思是「如神一般」，也是掌管羅馬天主教會的大天使；祂為士兵與戰士帶來神聖的力量，卻不負責處理人類在自由意志下做出的戰爭惡行。當太陽行經天秤座（九月至十月），是祂力量最強大的時候。牌中身穿盔甲的麥可站在地球上方，將真理之劍、清晰的心智與善意賜給人類；紅玫瑰代表人道博愛之情。抽到這張牌，表示你或許因生活的壓力而疲憊；請重新點燃熱情，盡可能真實地生活，誠實與正直的聖靈正在上方看顧你。請帶著謙卑、自信、善良的心與高貴的意圖，走上你的人生道路。"], "ref": "詳見書中第 223 頁起"}, {"id": "hearts_00", "zh": "心之一", "en": "Ace of Hearts", "img": "cards/hearts_00.webp", "paras": ["書中說，愛的精華就是信心，那是與另一個人合一後油然而生、難以言喻的感受，對象可以是內在的自己，也可以是他人；要與他人分享愛，先要確保自我之愛已在自己心中。牌中兩隻美人魚在海裡把一顆飛翔之心往上推，如日出般迎向天空的金光，象徵最高層次的愛的接納，那顆心帶著象徵靈性自由的翅膀。書中指出，每個牌組的一號牌都是積極正面的，心之一表示一份新的愛的機會正從過去（海洋）升起，可能是對某個人、想法、夢想的實現，或是一份新的連結。抽到這張牌，請敞開你的心迎接它，對愛保持信心；愛像永恆不滅的火焰，永遠不會拋下你。"], "ref": "詳見書中第 227 頁起"}, {"id": "hearts_01", "zh": "心之二", "en": "Two of Hearts", "img": "cards/hearts_01.webp", "paras": ["牌中的男人魚與美人魚由一道彩虹連結，使兩人取得平衡；兩隻海豚代表宇宙的才智，帶著喜悅一起穿過彩虹。書中提到，神話中的海豚因為成功撮合海洋女神（Amphitrite）與海神波塞頓，被放入星空成為海豚座。心之二可以代表兩個相愛的人，也可以是一個人試圖整合、變得完整的兩個面向，因此各種形式的婚姻、結合與聯姻，都與這張牌有關；二號牌都在吸引二元調和的可能。你現在也許正與一位深愛的伴侶分享你的心，這個靈性夥伴可能是愛人、朋友，或是更高的覺醒狀態；請記得，你的心本身就是一座彩虹橋，連結內在神聖小孩的源頭，並幫助療癒你深愛之人心中已久的傷痛。"], "ref": "詳見書中第 229 頁起"}, {"id": "hearts_02", "zh": "心之三", "en": "Three of Hearts", "img": "cards/hearts_02.webp", "paras": ["書中說，敬拜古代女神的人相信世界是從深海神祕的韻律中創造出來的，東方神祕學家則認為每個人心中都住著一個真正的自我，是恆久舞動的神性；心與高我之間的連結，是維持和諧生活的重要面向。牌中，歡笑的泡泡從開心的蚌中浮上水面，藏寶箱靜靜坐落在海底，尚未打開；兩隻海洋生物因貝殼豎琴的樂音而歡欣，彈奏的是第三種海洋生物美人魚。書中提到，在譚崔傳承中，節奏代表樂音的力量，也是真實之神的心跳，潛入深深的意識就能察覺。心之三是歡慶的召喚，激起內在的玩心、想像力與永恆的友誼。抽到這張牌，請找到心中的小孩，讓他知道自己多麼被珍惜、被愛，讓感受像泡泡一樣浮起；這張牌也可能象徵慶祝或派對，數字3代表與家人朋友齊聚。"], "ref": "詳見書中第 231 頁起"}, {"id": "hearts_03", "zh": "心之四", "en": "Four of Hearts", "img": "cards/hearts_03.webp", "paras": ["書中說，失落的寶藏、失去的希望、破碎的心與悲傷的道別，都是生命旅程中可能遇到的情緒面向，但敞開的心總有希望的潮汐在流動，悲傷之後會有喜悅的潮汐，這是愛的另一面。牌中的美人魚失去了希望：她的小船在暴風中傾覆，飛翔之心項鍊也壞了；但她很快就會抬起頭，看見三位朋友駕著海豚來拯救她。看似失去的將會重新尋得，只要在自己身上或生活中重新建立新的信任基礎與希望。心之四也許正在描述你的某種情緒狀態；請允許自己花時間感受這些情緒，敬重內省的過程，當你保有信心與希望，新的啟示就會溫柔地到來，修復你受傷的心。與感受同在，是生命道路上非常關鍵的一步。"], "ref": "詳見書中第 233 頁起"}, {"id": "hearts_04", "zh": "心之五", "en": "Five of Hearts", "img": "cards/hearts_04.webp", "paras": ["書中說，經歷人生的暗夜時刻時，會需要一段反思與休息，心之五以海龜、平靜的海水與一彎新月代表這段時間。心之四那位悲傷的美人魚，在這張牌打開了藏寶箱，得到一顆特別的飛翔之心，她看著紅心中間的金色五角星，那是她在天上的指引之星；五角星傳統上代表人類的完美，也可作為靈性的守護，數字5的主要特質是改變，美人魚正見證心的改變，療癒過往的傷痛。抽到這張牌，當生活出現改變，特別是情緒與情感上的轉變，你可能感到茫然、脆弱；書中說，這些改變正受到你心上那顆金色星星，也就是你的高我，所指引與守護。當你休息足夠，創造力就能跟上起伏的混亂；別被憂鬱打敗，人與人之間的愛與神性之愛，都將再次重生。"], "ref": "詳見書中第 235 頁起"}, {"id": "hearts_05", "zh": "心之六", "en": "Six of Hearts", "img": "cards/hearts_05.webp", "paras": ["自古以來，人們相信鸛鳥是新生命即將降臨的徵兆，鸛鳥常出現在池塘與沼澤邊，因此被視為送子鳥。牌中，五隻美人魚聚集在一起，從海洋浮出，第六隻美人魚坐在鸛鳥背上飛翔，從天空遞出一條靈性的生命線；海面上的五隻美人魚代表潛意識，浮上表面接觸空氣與陽光，象徵更高程度的揭露，當她們彼此觸碰、更靠近天空，便感到歡欣喜悅。書中形容，就像海洋讓你流淚，太陽再把你的眼淚擦乾，這是你值得擁有的內在療癒。數字6意味著支持、奉獻、責任與合一，也代表平衡情緒生活的必要。現在也許適合進行與家人有關的療癒，或解決與所愛之人的衝突；你和朋友或社群之間，可能正要出現直通心底的深刻連結。"], "ref": "詳見書中第 237 頁起"}, {"id": "hearts_06", "zh": "心之七", "en": "Seven of Hearts", "img": "cards/hearts_06.webp", "paras": ["書中說，7是奧秘的數字，代表願景、夢想與沉思，與人體七大脈輪、彩虹七色、中東智慧七柱、昴宿星團的七姊妹星，以及北斗七星都有關。牌中的美人魚坐在放有七顆飛翔之心的拱門下靜心冥想，那是沉沒的亞特蘭提斯神殿；她配戴一個七角星，象徵帶來保護與指引的靈性之光，她也正凝視著星星。當你透過靜心思考宇宙的真理與秘密，就能跨越時間與空間、擴展意識，也會覺察豐沛的神性充滿心中，並需要更高程度的專注與清晰。現在或許是收束精力、專心讓自己在靈性上沉澱於當下的時候；請透過內在的需求平衡外顯的慾望，花時間獨處滋養靈魂，創造一個外界紛擾無法侵入的小世界或避難所，在專注於心的時刻，甜蜜的訊息就可能來臨。"], "ref": "詳見書中第 239 頁起"}, {"id": "hearts_07", "zh": "心之八", "en": "Eight of Hearts", "img": "cards/hearts_07.webp", "paras": ["書中說，無限符號代表完整，由代表太陽的右半與代表月亮的左半構成，意味著合一或兩性之間的平衡；古代神祕學家認為它是雙生男神或雙生女神的象徵，被讚頌為魔術師、療癒師與帶來祝福的天使。牌中，一對雙生的水之精靈藉由代表力量與改變的兩個圓圈結合為一，吹奏平和的樂音，身後的潮水卻隨著有力的韻律起伏；圖案中以八個八分音符狀的飛翔之心作為代表。數字8本身就是無限符號，代表熱情、性、力量與再生；書中說，兩股相對之力的融合，是理解個人轉化的關鍵，我們內在同時有陰性與陽性的能量，若能建設性地運用，就能共同創造更安全、更少傷害的世界。這張牌邀請你在感覺的世界裡，找到靈性與情緒的平衡點；當你把對自身力量的理解與宇宙的生命之流整合，深刻的改變就會發生，內在的和諧也將引領你實現天生療癒師的潛能。"], "ref": "詳見書中第 241 頁起"}, {"id": "hearts_08", "zh": "心之九", "en": "Nine of Hearts", "img": "cards/hearts_08.webp", "paras": ["書中說，井、容器或鍋子，可以盛裝儀式、祝福、淨化與療癒所用的神聖之水，水是萬物維持生命的必需；一杯水是半滿還是半空，端看你在當下用什麼角度看待生命，這就是這張牌要帶給你的提問。這張牌還會應允你一個願望：在傳統塔羅中，對應的聖杯九被視為「心想事成牌」，你的願望反映你認為自己值得擁有什麼、你的心之所向，以及你有多愛自己。書中提醒，有時必須先療癒過去的傷痛，才能長出你想實現的模樣，原諒自己與他人，能讓你更接近自我實現。牌中，美人魚抱著容器接引瀑布流下的水，她接受目前的生活，也準備好讓滿溢的一切流洩出去。請在生命之泉前高舉你的容器，讓它被完全注滿，想像無限的愛、喜悅與智慧注入你的心；這或許是靈性道路的起點，或一段淨化過程的開端，請相信奇蹟，跟隨夢想。"], "ref": "詳見書中第 243 頁起"}, {"id": "hearts_09", "zh": "心之十", "en": "Ten of Hearts", "img": "cards/hearts_09.webp", "paras": ["到了某個時候，你會找到一直追尋的寶藏，或感受到象徵希望的七色彩虹就在你心中；這是值得感恩的一刻，也可能是改變即將到來的過渡期，你可以對多年來引導、保護你的光之天使說聲「謝謝你」。牌中，九個飛翔之心共同點亮歡快的美人魚的氣場，第十個飛翔之心出現在她的額頭，象徵第三眼（眉心輪）正被打開，她已被喚醒，能感受到對全人類的愛與奉獻之心；書中說，心之牌組的第十張牌，代表強大的轉化，以及隨之而來、不可避免的情感新生。你的願望與夢想可能已成真，或你正試著達成一個重要的目標；當你把水注滿容器，也要承擔責任，因為這是把個人成就回饋給人類整體的時候。你可能把這些禮物贈與家人、更大的社群，甚至整個世界；請把雙臂高舉向天，讓極致的喜悅充滿你的心。"], "ref": "詳見書中第 245 頁起"}, {"id": "hearts_10", "zh": "心之孩子：金髮姑娘", "en": "Child of Hearts: Goldilocks", "img": "cards/hearts_10.webp", "paras": ["書中說，我們都在追求安全感與避風港，也好奇別人是怎樣用心過生活。《金髮姑娘與三隻熊》裡，熊、粥碗、椅子與床的尺寸都按大小有秩序地排列，三隻熊為自己打造的是儀式化的生活，相對固定，卻自然而和諧。金髮姑娘代表孩子的好奇心與純真，以及想找到真正的家、身分認同與家庭關係的渴望；她透過窗戶窺探小茅屋，那扇窗象徵宇宙之眼，或能映照出更大智慧的鏡子。她感到安全，於是嚐了食物、坐了椅子，還在床上睡著；熊回家後發現闖入者，她立刻逃走，雖然為原有的秩序帶來危機，卻也學到關於滋養、安全與親屬關係的一課。抽到這張牌，請敞開孩子般的心，感受溫暖家庭生活的精神，更接納所愛之人的生活方式；也許有客人或朋友前來，你會把他嚇跑，還是張開雙臂歡迎他？"], "ref": "詳見書中第 247 頁起"}, {"id": "hearts_11", "zh": "心之追尋者：綠野仙蹤——鐵皮人", "en": "Seeker of Hearts: The Tin Man", "img": "cards/hearts_11.webp", "paras": ["書中說，桃樂絲遇見鐵皮人時，他非常僵硬；創造他的鐵匠忘了給他一顆心，他需要被上油潤滑，象徵阻滯的情感讓他僵硬也痛苦。隨著故事進展，鐵皮人流下眼淚，過去讓他生鏽的眼淚，如今像油一樣，是愛與悲傷凝結的精華，能療癒過往的傷口。他在黃磚路上尋求一顆能愛、快樂、跳舞、歡唱的心；巫師說心其實不實用，鐵皮人仍希望擁有，因為沒有心就不算真正的人，巫師也告訴他：心的好壞不在於給出多少愛，而在於收到多少愛。牌中的鐵皮人穿著鎧甲，把自己與奇怪的感覺世界隔開；他騎的馬象徵靈魂的自由，白鴿是帶來和平與寧靜的神聖使者，帶著能讓他真正進化為人的心。抽到這張牌，請更加打開你的心，走進感覺、奉獻與慈悲的殿堂；記得表達情感，哭泣是釋放靈魂核心痛楚的方式；家人朋友遇到麻煩時，找到鼓舞他們的方式，做個傳遞宇宙之愛的戰士。"], "ref": "詳見書中第 249 頁起"}, {"id": "hearts_12", "zh": "心之指引者：綠野仙蹤——好魔女", "en": "Guide of Hearts: The Good Fairy", "img": "cards/hearts_12.webp", "paras": ["書中說，在遇到挫折或轉折的「靈魂暗夜」，我們可能一時看不見引導者與老師，感覺完全迷失；接著直到最後一刻，一道光才突然閃耀進來，我們的祈禱終於有了回應。《綠野仙蹤》中的北方好魔女雖是小角色，卻非常關鍵，像桃樂絲的守護天使：她靜靜地在背後等待，守護桃樂絲的平安，讓她一步步學習自己的課題，直到最後才揭露一切；她告訴桃樂絲，只要在魔法鞋上敲三下並唸「無處可比我的家」，就能回到堪薩斯，書中說，生命最大的難解之謎，永遠存在我們心中。牌中，原本要送桃樂絲回家的巫師意外乘熱氣球離開，好魔女從天而降，揮舞水晶權杖，重新為桃樂絲注入信心與神奇的法力。抽到這張牌，表示肉眼看不見的協助者或天使正送愛給你；即使眼前有難解的習題，也別灰心，相信自己，讓心靜下來，透過想像找到來自直覺的答案。你也可能是一位好魔女，你安慰人心的話語、輕柔的撫摸，或帶來啟發的例子，都能把人從暗夜導向光明。"], "ref": "詳見書中第 251 頁起"}, {"id": "hearts_13", "zh": "心之守護者：大天使加百列", "en": "Guardian of Hearts: Gabrielle", "img": "cards/hearts_13.webp", "paras": ["書中說，大天使加百列在這裡以女性的方式呈現，是傳達奧秘神諭的使者：在聖經中，祂曾在獅子坑幫助但以理解釋異夢，也預告施洗約翰即將誕生，並告訴瑪麗亞她的孩子耶穌是等待已久的救世主；《啟示錄》中，祂吹響新生的號角，呼籲人們離開憎惡，用無私的愛與慈悲擁抱彼此。加百列的名字意思是「神的英雄」，在藝術中常帶著百合花、王杖或神聖的卷軸，為虔誠者帶來好消息，讓犯下罪行的惡人得到審判或寬恕；祂也幫助人們透過連結本心的啟示，讓心靈與身體更加合一，力量最強大的時刻是太陽行經摩羯座之時，並與月亮、生命的循環與海洋的潮汐有關。牌中的加百列有著彩虹翅膀，是一隻金髮美人魚，吹奏和諧的樂音，吸引海豹與海洋生物浮出水面，並帶著代表普世之愛與人道善意的聖杯。抽到這張牌，請聆聽內在的呼喚，那可能關於靈性的新生；留意你的夢，對脆弱、疲憊的人保持慈悲，也許你會透過文字、言語、歌聲與輕柔的撫摸療癒所愛的人，並在世界各地的朋友之間搭起信任與理解的彩虹橋。"], "ref": "詳見書中第 255 頁起"}, {"id": "crystals_00", "zh": "水晶一", "en": "Ace of Crystals", "img": "cards/crystals_00.webp", "paras": ["北國的民間故事說，冬天世界沉入睡眠，白雪覆蓋的大地下方，小矮人正忙著把月亮、太陽與星星的光編織成水晶；春天萬物甦醒時，他們把這些寶石獻給天空，細密的春雨落下，便出現壯麗的彩虹。書中說，勤奮的小矮人為你找到了一顆美麗的水晶，帶來關於希望、合一與豐盛的承諾，現在是接受的時候；彩虹是連結天與地的橋，象徵全人類的和諧，中國人稱它為太極，意味著陰與陽的融合。抽到這張牌，表示極大的潛能已被發現，物質層面正有新生躍動，可能是一個孩子、一份事業、一本書、一段關係，或是新層次的自我表達；四個牌組的一號牌都帶來肯定的訊息：去開展全新的自己，多年來收起的點子與夢想，現在可以揭開了。"], "ref": "詳見書中第 259 頁起"}, {"id": "crystals_01", "zh": "水晶二", "en": "Two of Crystals", "img": "cards/crystals_01.webp", "paras": ["書中說，許多古代哲學都認為平衡是構成完整不可少的一部分，連占星學也有天秤座，代表公平、正義、平衡與協調合作。牌中兩個矮人孩子在玩蹺蹺板，必須透過觀察了解平衡與合作的道理，否則好玩的遊戲也可能變得危險；當兩人坐上蹺蹺板，就成為一體，象徵男性與女性特質的結合，開始共同學習兩極與關係的課題。這張牌代表意識互動的第一階段：象徵智慧的貓頭鷹停在樹幹的中間點，表示想在關係中彼此理解、平等，就必須找到中間點的智慧；高低起伏是每日生活的一部分，關鍵是用靈活流動的方式應對。抽到這張牌，請好好照顧自己、你的關係與健康，鍛鍊身心靈，讓你在互動中更容易找到平衡；生活或許像玩蹺蹺板，但只要帶著玩耍的心去體驗，也能成為美好的時光。"], "ref": "詳見書中第 261 頁起"}, {"id": "crystals_02", "zh": "水晶三", "en": "Three of Crystals", "img": "cards/crystals_02.webp", "paras": ["書中以跳繩為例：三人以上可以一起玩，能搭配順口溜或歌曲；孩子輪流擔任持繩者或跳繩的人，反映出最理想的群體互動法則，每位成員都要透過穩定的動作，共同創造一個屬於所有人的節奏。數字3代表團體活動、溝通與喜悅。這張牌象徵團體精神，以及當每位成員都全心投入時能共同達到的成就感；圖畫中的跳繩是一道彩虹，也是一座橋、一道能帶領世界走向和諧的拱門。抽到這張牌，是重新定義你身在團體中的目的的時候：愉快地分享你的智慧與天賦，加入更多群體，與頻率相通、尊重你人生看法的人分享生活；若你還沒找到自己的群體，這會是收穫豐富的時期，透過連結與分享，你會感受到越來越深的喜悅，自信與個人資源也會更強大。前提是，別忘了以遊玩的心情去經歷。"], "ref": "詳見書中第 263 頁起"}, {"id": "crystals_03", "zh": "水晶四", "en": "Four of Crystals", "img": "cards/crystals_03.webp", "paras": ["書中說，找到靈魂的重心很重要，像一股地心引力，能引出創造的意志力，幫助我們依照內心深處的價值觀打造自己的世界；責任感與建設性的行動，能讓人為自己與他人建立美麗生活的根基。牌中的矮人小孩合力用各種工具建造一個家，家的基礎是一棵蘋果樹，象徵生命之樹，在希臘神話中也是豐盛的象徵。書中提到，在泰國，人們會仿照房子的構造做成供神靈居住的小屋，稱為「神屋」，守護天使因此得以來到家中，帶來宇宙的愛與真理之光。矮人們非常專注，知道自己正經歷顯化的過程。抽到這張牌，請想想你正在生活中建造什麼、內在看見什麼樣的願景；書中說，要達成目標，必須具備四大要素：專注、責任、奉獻與勤奮。"], "ref": "詳見書中第 265 頁起"}, {"id": "crystals_04", "zh": "水晶五", "en": "Five of Crystals", "img": "cards/crystals_04.webp", "paras": ["牌中，矮人爺爺正為樹屋頂端神聖的曼荼羅放上最後一個物件，這個曼荼羅由一顆五角星與一個金色的圓構成，象徵天與地的結合；書中說，星星的五個尖端代表出生、起始、服務、長眠與轉化，這個符號也常用來裝飾居家或作為彩色玻璃窗的主題，因為它代表人類的進化，並像防護盾一樣具有守護作用。矮人爺爺吹著歡快的口哨，因為他已看到美麗的前景；樹上的蘋果已成熟，是完美完成任務後結出的果實，鳥兒帶來靈性自由的回報，而這種自由來自紮實穩定的生活方式。抽到這張牌，請完全敞開，接受它帶給你的禮物，摘下已然成熟的潛能果實並好好實現；你也許會想嘗試彩色玻璃、陶藝、木工、縫紉等手工藝，並在盡情發揮創意時，與大地及它的超凡之美保持連結。"], "ref": "詳見書中第 267 頁起"}, {"id": "crystals_05", "zh": "水晶六", "en": "Six of Crystals", "img": "cards/crystals_05.webp", "paras": ["牌中的六個小矮人同心協力，要完成爬到山頂的目標，其中一位已到達山頂，一朵閃耀的六角雪花正在那裡等著他，那是大自然的神奇結晶。書中說，六角星（六芒星）又被稱為愛神之花、大衛星或所羅門之印，古希臘數學家畢達哥拉斯認為，6是1到10之間唯一「完美」的數字，象徵神性智慧、和諧、均衡，以及陰陽意識的平衡。這張牌描述的是一同攻頂時的極致狂喜；想到達看似難以到達的高度，團隊合作、堅毅不懈、專一與目標導向是成功的關鍵。抽到這張牌，你需要對自己想達成的重要目標再次加倍付出；山路或許險峻，但回報無可計量。請帶著敬意看待所有過程，對自己保持信心，即使目前的工作平凡，只要目標超越一己私心，就有機會在未來幾年達成非凡的成就與喜悅。"], "ref": "詳見書中第 269 頁起"}, {"id": "crystals_06", "zh": "水晶七", "en": "Seven of Crystals", "img": "cards/crystals_06.webp", "paras": ["書中說，點燃蠟燭是具有象徵意義的舉動，代表現在是進一步點亮自己靈魂的時候；每年的冬至是一整年神聖的轉捩點，日子通常接近猶太人的光明節，人們透過祝禱慶祝太陽再次降臨，也榮耀如破曉般新生的高我，從此逐漸走出播下靈魂種子的孤單與黑暗，邁向智慧之花綻放的光明與合一。牌中年輕的矮人女孩正在打造屬於自己的神聖空間，讓她隨時尋得內在的平靜、清晰與遠見；她正經歷一段沉潛思索的時光，腳下的彩虹地毯象徵內在的轉化，七根蠟燭像猶太教的金燈臺，象徵點亮這個過程的明燈。抽到這張牌，表示你需要一段等待或休息的時間；請找到自己獨特的調整方式，放心相信一切都是最好的，耐心是此刻最重要的美德，暫停或養精蓄銳，靜定下來，讓內在的真相慢慢浮現。"], "ref": "詳見書中第 271 頁起"}, {"id": "crystals_07", "zh": "水晶八", "en": "Eight of Crystals", "img": "cards/crystals_07.webp", "paras": ["書中以花式溜冰為例：選手在冰上從容優雅的演出，背後是大量的投入與練習，他們像與天使同在，讓我們看見自然界與人類的完美結合與平衡。數字8代表深刻的改變與轉變，當一個人為追求卓越而全心投入，這樣的轉變不只影響他自己，也會擴及整個群體，這正是人類技能最極致的作用：讓世界變得更美好；當人們願意在藝術、教育與社會服務等領域奮力追求成功，人類就能開始實現帶著神性之愛與智慧的無限潛能。牌中溜冰的孩子在冰上畫出8的形狀，8是象徵無限的古老符號（常見為咬著自己尾巴、身體繞成兩圈的蛇），代表人類的無限潛能。抽到這張牌，請更深入地看看你目前的生活，找到你能分享給這世界的禮物，並允許未被看見的技能與創造力完全顯現。"], "ref": "詳見書中第 273 頁起"}, {"id": "crystals_08", "zh": "水晶九", "en": "Nine of Crystals", "img": "cards/crystals_08.webp", "paras": ["牌中，矮人小屋裡火光閃耀，空氣中瀰漫著平安夜的興奮與期待，一切就快完成，願望將成真，禮物就快揭曉。懷有身孕的矮人媽媽手中的蠟燭，代表即將到來的新生命的靈魂之光；聖誕樹下的禮物尚未打開，壁爐上的襪子還沒裝滿；書中說，九隻襪子表示深深接納來自更高殿堂的力量，九支蠟燭則使聖誕樹成為一顆發亮的水晶。矮人女孩期待聖誕老公公，但她知道必須先睡一覺、把自己交給夢中的另一個世界，禮物才會來到。這張牌帶我們看見生命中的一段特別時期：神聖的力量即將在未來實現，而那未來已近在眼前。矮人媽媽正在說故事；抽到這張牌時，請明白你也是自己人生的說書人：你想為這個故事加入什麼主題？當你即將完成這個人生階段，請信任自己將顯化的事物符合至善，也許有神奇的禮物、特別的友誼或新的機會就快來到你身邊。"], "ref": "詳見書中第 275 頁起"}, {"id": "crystals_09", "zh": "水晶十", "en": "Ten of Crystals", "img": "cards/crystals_09.webp", "paras": ["書中說，聖誕節是伴隨歡笑與期待的節日，願望可能實現，家人依偎在一起分享，為家庭注入溫暖與愛。牌中所有的襪子都放滿了禮物，矮人媽媽為寶寶掛上一隻迷你小襪子；矮人爸爸用聖誕柴火添火，為齊聚的家人朋友帶來光亮與喜悅；禮物都已打開，孩子們注視著自己的珍貴寶物，矮人女孩坐在彩虹地毯上，端詳著美麗的水晶；太陽高掛，家人心中滿是喜悅。書中說，傳統的節日儀式讓人們得以團圓，也讓節日多了一份感激，出於渴望與人連結、希望被愛。抽到這張牌，請打開人生為你準備的禮物；也許重新認識傳統習俗與祝福的方式，會點燃創意與想像力的新火花，你療癒人心的願景與意念，能讓世界各地的人獲得提升。請記得幫助弱勢與無家的人，並對一生中天使、靈性協助者與更高層級的老師帶來的祝福心懷感謝。"], "ref": "詳見書中第 277 頁起"}, {"id": "crystals_10", "zh": "水晶孩子：頑童流浪記——哈克貝利．芬", "en": "Child of Crystals: Huck Finn", "img": "cards/crystals_10.webp", "paras": ["水晶孩子由馬克．吐溫筆下的哈克貝利．芬代表，他象徵每個人內在尚未被馴服、渴望不那麼文明地與世界相處的部分。書中說，在意識形成的早期，我們從物質世界認識豐盛、誠實、界線、嘗試與責任等概念，回應的方式關係到孩子是否發展出超越年齡的成熟。哈克四處流浪，父親是鎮上的酒鬼；旅程來到密西西比河，浮現出他自己與友人吉姆的自由，以及對更高生活品質的嚮往；他與湯姆．索亞在洞穴找到強盜藏匿的錢財，如何善用這些物質資源也成了議題。他機智，一再嘗試並從錯誤中修正，心中有永保赤子之心的渴望，也像一面鏡子，映照出自然的狂野與牧神潘所代表的獨立精神。抽到這張牌，請讓冒險精神自由流動，暫時離開文明世界走進大自然，並問自己：你是否感覺自由？你是否以敏感而熟練的方式運用身體的優勢？你心中是否帶有任何恐懼？"], "ref": "詳見書中第 279 頁起"}, {"id": "crystals_11", "zh": "水晶追尋者：綠野仙蹤——膽小獅", "en": "Seeker of Crystals: The Cowardly Lion", "img": "cards/crystals_11.webp", "paras": ["書中說，我們都從人生的磨難中學到面對困難需要多大的勇氣。桃樂絲在樹林裡遇見膽小獅，他看起來自信滿滿，但威嚇的伎倆失效後，就必須面對自己的恐懼與脆弱；他決定加入桃樂絲、鐵皮人與稻草人，一同去找奧茲國的巫師求取勇氣。隨著故事進展，他為了從壞魔女手中解救桃樂絲，變成一頭勇敢的獅子；就像許多寓言一樣，當他必須保護同伴時，勇敢的真我就逐漸顯現，偽裝的假象不再適用，需要拿出真實、英勇與榮譽感。牌中的膽小獅走在黃磚路上，因成就而獲得一個花環；書中說，這張牌與美女與野獸牌關係密切，兩張同時出現，表示一個與靈性力量有關的重大議題正在浮現。抽到這張牌，請連結你隱而不見的力量與能力，有時要溫柔地用，有時要熱切地用；若恐懼與質疑讓你虛張聲勢或自私自利，最好的辦法是帶著敬意去真實感受自己的痛苦，綻放靈魂中的真實之光。"], "ref": "詳見書中第 283 頁起"}, {"id": "crystals_12", "zh": "水晶指引者：聖尼古拉", "en": "Guide of Crystals: St. Nicholas", "img": "cards/crystals_12.webp", "paras": ["書中說，現在的聖誕老公公雖與大眾文化和物質消費密不可分，但真正的聖誕老人（聖尼古拉）的核心精神，與地球的神聖源頭有關；靈性圈子有一種說法，地球的統領者叫聖納庫瑪拉。歷史上的聖尼古拉生於四世紀，來自小亞細亞的富家，虔誠、神蹟與熱情使他知名，他幫助罪人改邪歸正、與窮人分享財富，後來成為水手、囚犯與孩子們的贊助者；因為他的慷慨，孩子們開始在聖誕時節收到禮物。牌中的聖誕老公公握有顯化成真的關鍵鑰匙，兔子意味著豐饒與多產；他是大阿爾克納五號牌巫師的小牌版本，兩張牌都連結物質界與靈性世界，鼓勵我們追求更多智慧以創造豐盛。抽到這張牌，請看看你已擁有的豐盛與善意之井，對奇蹟抱持期待，相信「相信」本身具有魔力，重新點燃像孩子般的期待，做個慷慨、仁慈、永保感謝之心的人。"], "ref": "詳見書中第 285 頁起"}, {"id": "crystals_13", "zh": "水晶守護者：蓋亞母親", "en": "Guardian of Crystals: Gaia", "img": "cards/crystals_13.webp", "paras": ["蓋亞母親是大地水晶牌組的最後一張，也是整副《內在小孩童話療癒卡》的最後一張牌。書中說，她是溫柔看顧地球的大地守護者，豐盛、虔敬且充滿智慧，保護整個地球與所有自然界的生物，讓生態維持細緻的平衡，也幫助受污染的空氣、水源與土地恢復和諧；她因人類破壞雨林、使許多生物逐漸滅絕而感到痛心。二十一世紀之初，許多科學家提出「蓋亞假說」，把地球視為有生命、會呼吸的有機體。牌中的蓋亞把地球捧在雙手中，散發溫暖與滋養的光；她提醒我們，每個神聖的旨意都有四季之別，每個地球的轉化都經由有深意的週期完成；她胸前的白水晶飾品代表打開人類的喉輪，為全球創造更高程度的溝通，也使人們更加團結。抽到這張牌，請對生命賜與的禮物表達感謝，珍惜深刻的友誼，感謝養育你的父母與親友，並為美化大地、滋養土地貢獻一己之力，例如資源回收、園藝、種樹、捐款或志願服務，也到大自然的僻靜之處，探索來自大地之心的智慧。"], "ref": "詳見書中第 289 頁起"}];

/* ===== 互動流程 ===== */
const $ = (id) => document.getElementById(id);
const fan = $('fan'), spread = $('spread'), reveal = $('reveal');
const group = $('group'), stagecard = $('stagecard'), flipper = $('flipper');
const frontImg = $('frontImg'), hint = $('hint'), wait = $('wait');
const readBtn = $('readBtn'), againBtn = $('againBtn');
const readingInner = $('readingInner'), readingTitle = $('readingTitle');
const readingEn = $('readingEn'), readingBody = $('readingBody'), readingRef = $('readingRef');

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stacked = () => window.matchMedia('(max-width: 999px)').matches;
const sleep = (t) => new Promise((r) => setTimeout(r, t));
const narrow = () => window.innerWidth < 760 || window.matchMedia('(pointer: coarse)').matches;
const hintStart = () => '深呼吸，心裡想著一件事，憑直覺選一張牌。';

document.documentElement.style.setProperty('--wait', WAIT_SECONDS + 's');

let deck = [];
let busy = false;
let token = 0;

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    let j;
    try {
      const u = new Uint32Array(1);
      crypto.getRandomValues(u);
      j = u[0] % (i + 1);
    } catch (e) {
      j = Math.floor(Math.random() * (i + 1));
    }
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setHint(text) {
  hint.classList.add('fade');
  setTimeout(() => {
    hint.textContent = text;
    hint.classList.remove('fade');
  }, reduce ? 0 : 220);
}

function layoutSpread() {
  const S = Math.round(Math.max(300, Math.min(window.innerWidth - 24, window.innerHeight - 235, 800)));
  fan.style.setProperty('--S', S + 'px');
}

const RINGS = [0.42, 0.29, 0.16]; // 三圈牌的半徑（相對於圓的大小）

function buildFan() {
  deck = shuffle(CARDS);
  fan.innerHTML = '';
  layoutSpread();
  const hub = document.createElement('div');
  hub.className = 'hub';
  fan.appendChild(hub);

  // 依半徑比例，把牌分配到三個同心圓
  const n = deck.length;
  const total = RINGS.reduce((s, r) => s + r, 0);
  const counts = RINGS.map((r) => Math.floor((n * r) / total));
  counts[0] += n - counts.reduce((s, c) => s + c, 0);

  let i = 0;
  counts.forEach((count, ring) => {
    for (let j = 0; j < count; j++, i++) {
      const a = (j / count) * 360 + ring * (360 / count / 2);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fc';
      b.style.setProperty('--i', i);
      b.style.setProperty('--a', a.toFixed(2) + 'deg');
      b.style.setProperty('--rr', RINGS[ring]);
      b.dataset.rot = a;
      b.tabIndex = i === 0 ? 0 : -1;
      b.setAttribute('aria-label', '第 ' + (i + 1) + ' 張牌，按下翻開');
      const idx = i;
      b.addEventListener('click', () => pick(idx, b));
      fan.appendChild(b);
    }
  });
}

fan.addEventListener('keydown', (e) => {
  const cards = Array.from(fan.querySelectorAll('.fc'));
  const cur = cards.indexOf(document.activeElement);
  if (cur < 0) return;
  let next = cur;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (cur + 1) % cards.length;
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (cur - 1 + cards.length) % cards.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = cards.length - 1;
  else return;
  e.preventDefault();
  cards[cur].tabIndex = -1;
  cards[next].tabIndex = 0;
  cards[next].focus();
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (spread.classList.contains('on')) layoutSpread(); }, 150);
});

function fillReading(card) {
  readingTitle.textContent = card.zh;
  readingEn.textContent = card.en;
  readingBody.innerHTML = '';
  card.paras.forEach((t) => {
    const p = document.createElement('p');
    p.className = 'para';
    p.textContent = t;
    readingBody.appendChild(p);
  });
  if (card.ref) { readingRef.textContent = card.ref; readingRef.hidden = false; } else { readingRef.hidden = true; }
  readingInner.scrollTop = 0;
}

async function pick(i, btn) {
  if (busy) return;
  busy = true;
  const my = ++token;
  const card = deck[i];

  frontImg.src = card.img;
  frontImg.alt = card.zh + ' ' + card.en;
  fillReading(card);
  const imgReady = frontImg.decode().catch(() => {}); // 只在抽到時才載入這張牌的圖片

  // 記下被點選的那張牌的位置，讓它「飛」到中間
  const from = btn.getBoundingClientRect();
  const fromW = btn.offsetWidth;
  const rot = parseFloat(btn.dataset.rot) || 0;

  btn.classList.add('picked');
  spread.classList.remove('on');
  reveal.classList.add('on');
  setHint('');

  const to = stagecard.getBoundingClientRect();
  const dx = from.left + from.width / 2 - (to.left + to.width / 2);
  const dy = from.top + from.height / 2 - (to.top + to.height / 2);
  const s = fromW / to.width;

  if (!reduce) {
    const anim = stagecard.animate(
      [
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(' + s + ')' },
        { transform: 'none' }
      ],
      { duration: 850, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' }
    );
    await anim.finished.catch(() => {});
  }
  if (my !== token) return;

  // 翻到正面（若圖片還沒載入完，先等它）
  await imgReady;
  if (my !== token) return;
  flipper.classList.add('flipped');
  await sleep(reduce ? 0 : 1100);
  if (my !== token) return;
  stagecard.classList.add('glow');
  setHint('先不急著看解釋，靜靜地看著這張牌。');

  // 等待約 10 秒，再讓「看解釋」按鈕跳出
  wait.hidden = false;
  wait.classList.remove('run');
  void wait.offsetWidth;
  wait.classList.add('run');
  await sleep(WAIT_SECONDS * 1000);
  if (my !== token) return;

  wait.hidden = true;
  readBtn.hidden = false;
  setHint('準備好了，就來看看這張牌想對你說什麼。');
}

function openReading() {
  group.classList.add('open');
  readBtn.hidden = true;
  againBtn.hidden = false;
  setHint('慢慢讀，讓字句多停留一會兒。');
  readingInner.focus({ preventScroll: true });
  if (stacked()) {
    setTimeout(() => {
      $('reading').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }, 350);
  }
}

async function again() {
  const my = ++token;
  againBtn.hidden = true;
  reveal.classList.remove('on');
  setHint('');
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  await sleep(reduce ? 0 : 600);
  if (my !== token) return;

  group.classList.add('instant');
  group.classList.remove('open');
  flipper.classList.remove('flipped');
  stagecard.classList.remove('glow');
  wait.hidden = true;
  wait.classList.remove('run');
  readBtn.hidden = true;
  void group.offsetWidth;
  group.classList.remove('instant');

  buildFan();
  spread.classList.add('on');
  setHint(hintStart());
  busy = false;
}

readBtn.addEventListener('click', openReading);
againBtn.addEventListener('click', again);

buildFan();
setHint(hintStart());
</script>
</body>
</html>
